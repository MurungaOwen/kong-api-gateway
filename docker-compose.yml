services:
  kong:
    image: kong:3.7
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"   # proxy
      - "8001:8001"   # admin API (local dev only)
    depends_on:
      - product-api

  product-api:
    build: ./services/product-api
    expose:
      - "8080"

  billing-service:
    build: ./services/billing-service
    environment:
      KONG_ADMIN_URL: http://kong:8001
    ports:
      - "8090:8090"   # direct for now; JWT-protected route via Kong comes in milestone 5

  usage-ingest:
    build: ./services/usage-ingest
    ports:
      - "8100:8100"   # direct for inspection; Kong posts logs to it on the internal network
